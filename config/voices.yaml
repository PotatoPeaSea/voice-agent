# Named voice profiles. Switch with `active` or the /voice slash command in Discord (it rewrites `active`).
# List voice IDs:  npm run voices -- qwen-local | qwen-cloud | cartesia | elevenlabs
# `providerOptions` is passed straight to the provider for vendor-specific settings.
# `fallback` names another profile used automatically if this one fails.
active: clone-short

profiles:
  # Qwen3-TTS on the local GPU (services/qwen-tts). Preset English speakers: Aiden, Ryan.
  qwen:
    provider: qwen-local
    voiceId: Aiden          # "Sunny American male voice with clear midrange"
    language: English
    fallback: qwen-cloud

  # Short blend: first ~7s of the mall clip + first ~7s of the noodles clip (14.8s total),
  # so it stays realtime (~1.0-1.3x) (services/qwen-tts/voices/clone-short.{wav,txt}).
  clone-short:
    provider: qwen-local
    voiceId: clone-short
    language: English
    fallback: qwen
    providerOptions:
      temperature: 1.1

  # Shorter still: first ~4.4s of the noodles clip + first ~5.3s of the mall clip (10.2s),
  # ~1.1-1.4x realtime (services/qwen-tts/voices/clone-tiny.{wav,txt}).
  clone-tiny:
    provider: qwen-local
    voiceId: clone-tiny
    language: English
    fallback: qwen
    providerOptions:
      temperature: 1.1

  # Qwen3-TTS on Alibaba Cloud (DashScope). Used when the local service is down.
  qwen-cloud:
    provider: qwen-cloud
    voiceId: Ethan
    model: qwen3-tts-flash-realtime
    language: English

  cartesia:
    provider: cartesia
    voiceId: "REPLACE_WITH_CARTESIA_VOICE_ID"
    model: sonic-3.6
    providerOptions:
      emotion: content        # neutral | calm | angry | content | sad

  eleven:
    provider: elevenlabs
    voiceId: "REPLACE_WITH_ELEVENLABS_VOICE_ID"   # premade, designed or cloned voice IDs all work
    model: eleven_flash_v2_5                      # lowest-latency ElevenLabs model
    providerOptions:
      stability: 0.5
      similarity_boost: 0.75
      style: 0.0
      use_speaker_boost: true
