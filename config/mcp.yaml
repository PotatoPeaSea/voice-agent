# MCP servers whose tools the voice model calls directly: no agent, no read-back, answered
# within the turn (or in the background if slower than TOOL_WAIT_SECONDS).
#
# Each tool is offered as "<server>__<tool>". List only the tools you want: small models pick
# worse from long lists, every tool's description is sent on every turn, and these run without
# the agents' permission prompts. Tools the server doesn't mark read-only are described to the
# model as "Takes action: confirm with the user first".
#
# `core: false` keeps a server's tools out of the voice model's prompt (saving tokens on every turn); it loads them
# with find_tools when needed, and quick_agent / run_script always have them. Use it for the long tail.
#
# Per server: either `command` (+ `args`, `env`, `cwd`) for a local server on stdio, or `url`
# (+ `headers`) for a remote one over streamable HTTP. `${VAR}` is replaced from .env, so keys
# stay out of this file. `enabled: false` skips a server. The bot's own .env is NOT passed to
# local servers; give each one what it needs under `env`.

servers:
  # Web search and page reading. Exa's free, keyless endpoint (the same one Hermes falls back to).
  exa:
    url: https://mcp.exa.ai/mcp
    tools: [web_search_exa, web_fetch_exa]

  # Google Workspace (taylorwilsdon/google_workspace_mcp, needs uv): Gmail, Calendar, Drive and Docs, read-only
  # (--read-only drops every send, create, edit and delete tool). Needs a "Desktop app" OAuth client from your own
  # Google Cloud project with the Gmail, Calendar, Drive and Docs APIs on; put GOOGLE_OAUTH_CLIENT_ID,
  # GOOGLE_OAUTH_CLIENT_SECRET and USER_GOOGLE_EMAIL in .env. Authorize once with `npm run google:auth` (opens the
  # consent page in your browser); the token is then cached. Without those .env values the bot just logs
  # "needs ... in .env" and goes on without it. Each tool costs prompt space on every turn, so only the useful ones.
  google:
    core: false
    command: uvx
    args: [workspace-mcp, --tools, gmail, calendar, drive, docs, --read-only]
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL}
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    tools:
      - search_gmail_messages
      - get_gmail_message_content
      - get_gmail_thread_content
      - list_calendars
      - get_events
      - search_drive_files
      - get_drive_file_content
      - get_doc_content

  # Time zones and conversions (needs uv).
  # time:
  #   command: uvx
  #   args: [mcp-server-time]
  #   tools: [get_current_time, convert_time]

  # A remote server that wants a token, e.g. one on potato server reached through an SSH tunnel
  # (ssh -L 8910:127.0.0.1:8910 potatoserver). Check its actual path and auth scheme.
  # instagram:
  #   url: http://127.0.0.1:8910/mcp
  #   headers:
  #     Authorization: Bearer ${INSTAGRAM_MCP_TOKEN}
  #   tools: [...]  # the names you want; a wrong name logs the tools the server does have
